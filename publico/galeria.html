$('#arriba').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
addEventListener('scroll', () => { $('#arriba').hidden = scrollY < 2400; }, { passive: true });
// A− / A+: el tamaño de la letra, recordado en este equipo
let f = 1; try { f = +localStorage.getItem('mina_guia_f') || 1; } catch {}
const pon = () => { document.documentElement.style.setProperty('--f', f); try { localStorage.setItem('mina_guia_f', f); } catch {} };
$('#menos').onclick = () => { f = Math.max(0.85, +(f - 0.1).toFixed(2)); pon(); }; $('#mas').onclick = () => { f = Math.min(1.5, +(f + 0.1).toFixed(2)); pon(); }; pon();
</script>
</body>
</html>
