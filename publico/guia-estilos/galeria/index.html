<body data-ver="todo">
<header><div class="envuelve">

<script>
/* RLR · Ricardo López Reyero — la galería pinta cada pieza en el momento con el generador (arte.js): por eso no pesa y no se acaba.
   Las imágenes se pintan una vez y se quedan como foto; los GIF se mueven solo mientras están a la vista. */
'use strict';
const _RLR = 'Ricardo López Reyero', _k = 'EYE', _rev = 181218;
const $ = (s) => document.querySelector(s), A = window.ArteMina, G = window.GALERIA, R = $('#rejilla');
G.gif = G.gif.slice(3).concat(G.gif.slice(0, 3));      // las dos listas empiezan por la misma figura: se recorre una para que no queden juntas
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let avisoT = 0; const aviso = (t) => { const a = $('#aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), 1900); };
const de = (l) => l[Math.floor(Math.random() * l.length)];
const receta = (r) => ({ base: '../', estilo: r.e, paleta: r.p, fondo: r.f, semilla: r.s, movimiento: r.m || '', formato: 'vertical' });      // base: las gemas viven una carpeta arriba
const alAzar = (tipo) => { const e = de(G.figuras), [p, f] = de(G.pares[e]); return { e, p, f, s: 1 + Math.floor(Math.random() * 999999), m: tipo === 'gif' ? de(['giro', 'giro', 'latido', 'ola', 'vaiven', 'cascada']) : '' }; };

// ── la fila de trabajo: una foto a la vez, para que el scroll no se trabe ──
const cola = []; let ocupada = false; const lienzo = document.createElement('canvas');
async function trabaja() {
  if (ocupada) return; ocupada = true;
  while (cola.length) {
    const P = cola.shift(); if (P.foto || !P.el.isConnected) continue;
    try {
      const info = await A.pintar(lienzo, { ...receta(P.r), escala: 0.4 }); P.info = info;
      const blob = await new Promise((si) => lienzo.toBlob(si, 'image/jpeg', 0.86)); P.foto = URL.createObjectURL(blob);
      P.el.querySelector('.vista').insertAdjacentHTML('afterbegin', `<img src="${P.foto}" alt="${esc(info.texto)}" decoding="async">`);
      if (!P.r.m) pinta(P, info);
    } catch { P.el.querySelector('.pie b').textContent = 'No cargó. Recarga la página.'; }
    await new Promise((si) => setTimeout(si, 0));
  }
  ocupada = false;
}
const nombres = (i) => `${esc(A.ESTILOS[i.estilo].n)} · ${esc(A.PALETAS[i.paleta].n)}<small>${esc(A.FONDOS[i.fondo].n)}${i.movimiento ? ' · ' + esc(A.MOVIMIENTOS[i.movimiento]) : ''} · semilla ${i.semilla}</small>`;
const pinta = (P, i) => { P.el.querySelector('.pie b').innerHTML = nombres(i); };

// ── cada pieza: se pinta al acercarse; el GIF se mueve mientras está a la vista ──
const piezas = new Map();
const cerca = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { const P = piezas.get(e.target); cerca.unobserve(e.target); if (P && !P.foto) { cola.push(P); trabaja(); } } }, { rootMargin: '900px 0px' });
const aLaVista = new IntersectionObserver((es) => { for (const e of es) { const P = piezas.get(e.target); if (!P) continue; if (e.isIntersecting) prende(P); else apaga(P); } }, { rootMargin: '60px 0px' });
async function prende(P) {
  if (P.vivo || P.prendiendo || document.body.dataset.ver === 'img') return; P.prendiendo = true;
  const c = document.createElement('canvas');
  try { const v = await A.animar(c, { ...receta(P.r), escala: 0.3, segundos: 3, fps: 24 }); if (!P.prendiendo) { v.parar(); return; } P.vivo = v; P.lienzo = c; P.info = v.info; P.el.querySelector('.vista').appendChild(c); pinta(P, v.info); }
  catch {} P.prendiendo = false;
}
function apaga(P) { P.prendiendo = false; if (P.vivo) { P.vivo.parar(); P.vivo = null; } if (P.lienzo) { P.lienzo.remove(); P.lienzo.width = P.lienzo.height = 0; P.lienzo = null; } }
function agrega(r, tipo) {
  const el = document.createElement('article'); el.className = 'pieza ' + tipo;
  el.innerHTML = `<div class="vista"><span class="tipo">${tipo === 'gif' ? 'GIF' : 'IMAGEN'}</span></div><div class="pie"><b>${esc(A.ESTILOS[r.e].n)} · ${esc(A.PALETAS[r.p].n)}<small>${esc(A.FONDOS[r.f].n)}</small></b><button class="baja" title="Descargar">⬇ ${tipo === 'gif' ? 'GIF' : 'PNG'}</button></div>`;
  R.appendChild(el); const P = { el, r, tipo }; piezas.set(el, P); cerca.observe(el); if (tipo === 'gif') aLaVista.observe(el);
  el.querySelector('.baja').onclick = () => baja(P);
}
const bajar = (blob, nombre) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); };
async function baja(P) {
  const b = P.el.querySelector('.baja'); if (b.disabled) return; b.disabled = true; const antes = b.textContent;
  try {
    if (P.tipo === 'gif') {
      const g = await A.gif({ ...receta(P.r), movimiento: (P.info && P.info.movimiento) || P.r.m, escala: 0.4 }, { segundos: 3, fps: 20, alAvance: (x) => { b.textContent = Math.round(x * 100) + ' %'; } });
      bajar(g, g.info.nombre); aviso(`GIF listo · ${(g.size / 1048576).toFixed(1)} MB`);
    } else {
      b.textContent = '…'; const c = document.createElement('canvas'), i = await A.pintar(c, receta(P.r));
      bajar(await A.aPng(c), i.nombre); c.width = c.height = 0; aviso('Imagen descargada · 1080 × 1920');
    }
  } catch { aviso('No se pudo. Intenta otra vez.'); }
  b.textContent = antes; b.disabled = false;
}

// ── primero las cien escogidas, revueltas imagen y GIF; después, las que se hacen solas, sin fin ──
let hechas = { img: 0, gif: 0 }, turno = 0; const cortes = {};
function mas(n) {
  const ver = document.body.dataset.ver;
  for (let k = 0; k < n; k++) {
    const tipo = ver === 'todo' ? (turno++ % 2 ? 'gif' : 'img') : ver, i = hechas[tipo]++;
    if (i === G[tipo].length && !cortes[ver]) { cortes[ver] = 1; R.insertAdjacentHTML('beforeend', '<div class="corte" data-de="' + ver + '"><b>De aquí en adelante, recién hechas</b>Estas se están haciendo en este momento, solo para ti: nadie más las ha visto. Si una te gusta, bájala, porque al recargar salen otras.</div>'); }
    agrega(i < G[tipo].length ? G[tipo][i] : alAzar(tipo), tipo);
  }
  cuenta();
}
const cuenta = () => { const n = (t) => R.querySelectorAll('.pieza.' + t).length; $('#cuenta').textContent = `${n('img')} imágenes · ${n('gif')} GIF · sigue bajando`; };
new IntersectionObserver((es) => { if (es[0].isIntersecting) mas(12); }, { rootMargin: '1400px 0px' }).observe($('#fin'));
let rueda = 0; addEventListener('scroll', () => { const ahora = Date.now(); if (ahora - rueda > 250 && document.documentElement.scrollHeight - scrollY - innerHeight < 1200) { rueda = ahora; mas(12); } }, { passive: true });      // por si el aviso de arriba no alcanza a dispararse
for (const b of document.querySelectorAll('.filtro button')) b.onclick = () => {
  document.body.dataset.ver = b.dataset.ver; for (const x of document.querySelectorAll('.filtro button')) x.classList.toggle('on', x === b);
  if (b.dataset.ver === 'img') for (const P of piezas.values()) apaga(P);
  const visibles = R.querySelectorAll(b.dataset.ver === 'todo' ? '.pieza' : '.pieza.' + b.dataset.ver).length; if (visibles < 16) mas(16 - visibles);
  scrollTo({ top: Math.min(scrollY, $('.barra').offsetTop) });
};
mas(16);
// A− / A+: el tamaño de la letra, recordado en este equipo
let f = 1; try { f = +localStorage.getItem('mina_guia_f') || 1; } catch {}
const pon = () => { document.documentElement.style.setProperty('--f', f); try { localStorage.setItem('mina_guia_f', f); } catch {} };
$('#menos').onclick = () => { f = Math.max(0.85, +(f - 0.1).toFixed(2)); pon(); }; $('#mas').onclick = () => { f = Math.min(1.5, +(f + 0.1).toFixed(2)); pon(); }; pon();
</script>
