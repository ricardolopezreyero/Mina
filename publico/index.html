<style>
/* RLR · todo el estilo va aquí: una sola descarga, tipografía del sistema */
:root{--f:1;--bg:#1b120e;--caja:#2a1c16;--borde:#5a3d2c;--tx:#f3e6d8;--su:#c9b29c;--ac:#ffd23f;--ok:#6fdc7a;--mal:#ff6b5a;--az:#6ec3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);
  font:calc(14px*var(--f))/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body.contraste{--caja:#000;--borde:#fff;--tx:#fff;--su:#fff;--ac:#ffe600}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:#1b120e;background:var(--ac);border:0;border-radius:6px;padding:.45em .9em;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}button:disabled{background:#6b5a4c;color:#2a1c16;cursor:not-allowed;filter:none}
button.s{background:transparent;color:var(--tx);border:1px solid var(--borde)}
button.mal{background:var(--mal)}
input,select{font:inherit;background:#120b08;color:var(--tx);border:1px solid var(--borde);border-radius:6px;padding:.4em .6em}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 2px #000;visibility:hidden}
body.jugando .hud{visibility:visible}
.hud>*{pointer-events:auto}
#izq{left:10px;top:10px;width:calc(210px*var(--f))}
.barra{height:calc(14px*var(--f));background:#0008;border:1px solid #000;border-radius:4px;overflow:hidden;position:relative;margin:2px 0 5px}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .15s}
.barra b{position:absolute;inset:0;text-align:center;font-size:.72em;line-height:calc(14px*var(--f));font-weight:700}
.barra.bajo i{background:var(--mal);animation:parp .5s infinite}
.barra.golpe{animation:golpe .4s}
@keyframes golpe{0%{box-shadow:0 0 0 3px var(--mal);transform:scale(1.05)}}
@keyframes parp{50%{opacity:.4}}
#datos{display:flex;gap:10px;font-weight:800;font-size:1.05em;flex-wrap:wrap}
#datos span{background:#0007;border-radius:5px;padding:1px 7px}
#vel{display:none;margin-top:8px;width:calc(128px*var(--f));background:#0007;border-radius:8px;padding:5px 8px 6px;text-align:center;line-height:1.15}
#vel svg{display:block;width:100%;overflow:visible}
#vel path{fill:none;stroke-width:6;stroke-linecap:round}#vel .f{stroke:#ffffff33}#vel .r{stroke:#ff6b5aaa}
#vel .m{stroke:#fff9;stroke-width:1.5}
#vel #velAg{stroke:var(--ac);stroke-width:3;stroke-linecap:round;transform-origin:50px 54px;transition:transform .14s linear}
#vel circle{fill:var(--ac)}
#vel b{display:block;font-size:1.25em;font-weight:800}#vel small{display:block;color:var(--su);font-size:.78em}
#din{color:var(--ac)}
#metas{left:50%;top:8px;transform:translateX(-50%);width:min(430px,44vw);font-size:.8em}
#metas .m{background:#0007;border-radius:5px;padding:2px 7px;margin-bottom:3px;position:relative;overflow:hidden}
#metas .m i{position:absolute;inset:0 auto 0 0;background:#ffd23f33}
#metas .m span{position:relative}
#metas .m.ya{outline:1px solid var(--ac);color:var(--ac)}
#metas .m.mal{outline:1px solid var(--mal);color:#ffb3a8;background:#3a0f0acc}
#der{right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end}
#botones{display:flex;gap:4px;align-items:center}
#botones button{padding:.3em .6em;background:#0007}
#bVol{background:#0007;border-radius:5px;padding:.2em .45em;font-size:.8em;min-width:3.6em;text-align:center}
#panSon{display:none;background:#120b08f2;border:1px solid var(--borde);border-radius:8px;padding:6px 10px;margin-top:6px;width:calc(250px*var(--f));text-align:left;font-size:.86em}
#panSon label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
#tabla,#tarjeta{width:calc(250px*var(--f))}
.qr{position:static;display:inline-block;width:min(300px,70vw);height:auto;image-rendering:pixelated;border-radius:8px;border:6px solid #fff}
#tabla{background:#0007;border-radius:6px;padding:4px 7px;margin-top:6px;font-size:.8em;text-align:left}
#tabla div{display:flex;gap:5px;align-items:center;white-space:nowrap}
#tabla div b{flex:1;overflow:hidden;text-overflow:ellipsis}
#tabla i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
#tabla .off{opacity:.5}
#viaje{left:10px;bottom:10px;width:calc(250px*var(--f));font-size:.86em}
#vjDatos{background:#120b08e0;border:1px solid var(--borde);border-radius:8px;padding:6px 10px}
#vjDatos .l{display:flex;justify-content:space-between;gap:10px;line-height:1.55;color:var(--su)}
#vjDatos .l b{color:var(--tx);white-space:nowrap}
#vjDatos .l:nth-child(3) b{color:var(--ac)}
#vjDatos .l.mal,#vjDatos .l.mal b{color:var(--mal)}
#vjDatos .bar{height:4px;background:#000a;border-radius:2px;margin:1px 0 3px;overflow:hidden}
#vjDatos .bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
#vjDatos .bar.llena i{background:var(--ok)}
#vjDatos{cursor:pointer}
#vjDatos .l.rec{font-size:.9em;margin-top:3px;padding-top:3px;border-top:1px solid #ffffff1c}
#vjDatos .l.rec b{color:var(--su);font-weight:600}
#vjDatos .bod{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff1c;font-size:.9em;max-height:5.6em;overflow:hidden}
#vjDatos .bod span{white-space:nowrap}
#vjDatos .bod i{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-right:4px;border:1px solid #0008}
#bGrua{display:none;width:100%;margin-top:5px;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:#120b08e0;border:1px solid var(--ac);border-radius:8px;padding:.4em .75em;font-weight:600;text-shadow:none}
#bGrua b{color:var(--ac)}
#bGrua kbd{font:700 .9em system-ui;color:#1b120e;background:var(--ac);border-radius:4px;padding:0 .45em}
#bGrua.no{border-color:var(--borde);color:var(--su)}#bGrua.no kbd{background:var(--su)}
#contratos .c{margin-top:5px;padding:2px 2px;color:var(--su);font-size:.92em;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#contratos .c:hover{color:var(--tx)}
#contratos .c small{color:var(--ac);font-weight:700;font-size:1em}
#contratos .c em{font-style:normal;background:#0008;border-radius:8px;padding:0 6px;margin-left:2px}
#objetos{right:10px;bottom:10px;display:flex;gap:4px}
#objetos div{background:#0008;border:1px solid var(--borde);border-radius:6px;padding:3px 6px;text-align:center;min-width:44px;font-size:.78em;cursor:pointer}
#objetos kbd{display:block;font:700 1.15em system-ui;color:var(--ac)}
#objetos .n0{opacity:.4}
#avisos{left:10px;top:calc(222px*var(--f));width:calc(260px*var(--f));font-size:.8em}
#avisos div{background:#0008;border-radius:4px;padding:2px 7px;margin-top:3px;animation:entra .25s}
@keyframes entra{from{opacity:0;transform:translateX(-12px)}}
#tarjeta{margin-top:6px;text-align:left;font-size:.82em}
#tarjeta div{background:#120b08e6;border-left:3px solid var(--ac);border-radius:6px;padding:4px 9px;margin-bottom:5px;animation:pop .25s}
#tarjeta div.msj{border-left-color:var(--az)}
#tarjeta h3{margin:0;color:var(--ac);font-size:1em;line-height:1.25}#tarjeta .msj h3{color:var(--az)}
#tarjeta p{margin:1px 0 0;color:var(--su);line-height:1.25}
@keyframes pop{from{transform:translateX(14px);opacity:0}}
#ojo{display:none;background:#000c;border:1px solid var(--borde);border-radius:5px;padding:2px 8px;font-size:.8em;font-weight:700;white-space:nowrap;z-index:2}
.foto{position:static;display:inline-block;width:min(420px,78vw);height:auto;border-radius:10px;border:2px solid var(--borde)}
#pista{left:50%;bottom:16%;white-space:nowrap;transform:translateX(-50%);background:#000a;border-radius:6px;padding:4px 12px;font-weight:700;display:none}
#pista.dis{bottom:calc(50px*var(--f));font-weight:500;font-size:.8em;background:#0005;padding:2px 10px;color:var(--su)}
#aviso-red{left:50%;top:40%;transform:translate(-50%,-50%);background:#000d;border:2px solid var(--mal);border-radius:10px;padding:14px 22px;font-weight:800;display:none}
#cuenta{left:50%;top:14%;transform:translateX(-50%);font-size:2em;font-weight:900;color:var(--ac);display:none;text-align:center}
#velo{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#velo.on{display:flex}
.caja{background:var(--caja);border:2px solid var(--borde);border-radius:12px;width:min(760px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 12px 40px #000a}
.caja header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--borde)}
.caja header h2{margin:0;font-size:1.2em;flex:1}
.caja header .d{color:var(--ac);font-weight:800}
.cuerpo{padding:14px 14px 12px;overflow:auto;-webkit-user-select:text;user-select:text}
.pest{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px 0}
.pest button{background:transparent;color:var(--su);border:1px solid var(--borde);font-weight:600}
.pest button.on{background:var(--ac);color:#1b120e}
.fila{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff14}
.fila .t{flex:1;min-width:0}.fila .t b{display:block}.fila .t small{color:var(--su);display:block}
.fila .v{color:var(--ac);font-weight:800;white-space:nowrap}.fila .v.ya{color:var(--ok)}
.fila .ic{font-size:1.7em;width:1.5em;text-align:center;flex:none;line-height:1}
.cant{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:9px 0 5px;color:var(--su)}
.cant button{min-width:3em;padding:.3em .5em}.cant button.on{background:var(--ac);color:#1b120e;border-color:var(--ac)}
.pest button small{opacity:.65;font-weight:600;margin-left:2px}
.fila.tengo{opacity:.55}.fila.act{background:#ffd23f14;border-radius:6px;padding:7px 8px}
.nota{color:var(--su);font-size:.9em;margin:.4em 0}
.grande{font-size:1.6em;font-weight:900;color:var(--ac)}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rej>div{background:#0004;border:1px solid var(--borde);border-radius:8px;padding:7px 9px}
.rej>div.no{opacity:.4}
.rej b{display:block}.rej small{color:var(--su)}
.maqs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.maqs button{background:#0004;border:2px solid var(--borde);padding:6px;height:70px}
.maqs button.on{border-color:var(--ac);background:#ffd23f22}
.maqs canvas{position:static;width:56px;height:56px}
.maq{display:flex;gap:12px;align-items:center;background:#0004;border:1px solid var(--borde);border-radius:8px;padding:8px 10px}
.maq canvas{position:static;width:80px;height:80px;flex:none}
.maq small{display:block;color:var(--su);margin-top:2px}
label.op{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #ffffff14}
label.op span{flex:1}
h4{margin:12px 0 4px;color:var(--ac)}
.dos{display:grid;grid-template-columns:1.3fr 1fr;gap:6px 22px;align-items:start}.dos h4{margin-top:4px}
.dos>div+div{border-left:1px solid #ffffff1c;padding-left:22px}
.metros{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.metros input{width:100%;font-size:1.7em;font-weight:800;color:var(--ac);text-align:right;padding:.2em .4em}
.metros span{font-size:1.3em;font-weight:800;color:var(--su)}
input[type=range]{width:100%;padding:0;accent-color:var(--ac)}
@media (max-width:640px){.dos{grid-template-columns:1fr}.dos>div+div{border-left:0;padding-left:0}}
a{color:var(--az)}
@media (max-width:760px){#metas{top:auto;bottom:calc(150px*var(--f));width:60vw}#avisos{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="izq">
  <div>Combustible</div><div class="barra" id="bComb"><i></i><b></b></div>

</div>

<div class="hud" id="ojo"></div>
