body.movil #velo.inicio .caja{border-radius:0;border-top:0;padding-top:env(safe-area-inset-top)}
body.movil #velo.inicio .caja header::before{display:none}
body.movil #velo.inicio .caja,body.movil .caja.alta{min-height:calc(100% - env(safe-area-inset-top))}
body.movil label.op{gap:10px}
body.movil label.op>span{flex:1 1 0;min-width:90px}
body.movil label.op select{max-width:62%}
body.movil .fila{justify-content:flex-end}
body.movil .fila .t{flex:1 1 150px}
body.movil .fila:has(.v) .t{flex-basis:calc(100% - 52px)}
body.movil .fila:has(.v):not(:has(.ic)) .t{flex-basis:100%}
body.movil .fila.top .t{flex-basis:0;min-width:80px}
body.movil .fila.top .v{font-size:.95em}
body.movil #panSon{position:relative;z-index:3}
body.movil .caja header{padding:10px 12px}
body.movil .pest{gap:5px;padding:8px 10px 0}
body.movil .pest button{padding:.5em .75em}
body.movil .cuerpo{padding:12px}
body.movil #caja button{padding:.55em .9em;min-height:40px}
body.movil .fila{flex-wrap:wrap}
body.movil #verEspera{bottom:calc(84px + env(safe-area-inset-bottom))}
body.movil #verTeclado{display:none!important}
/* acostado: los objetos en fila abajo a la derecha, y el tablero de abajo más angosto */
@media (orientation:landscape){
  body.movil #objetos{flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:flex-start;max-width:52vw}
  body.movil #viaje{max-width:44vw}
  body.movil #metas{bottom:calc(60px + env(safe-area-inset-bottom));left:auto;right:calc(8px + env(safe-area-inset-right));width:min(40vw,300px)}
  body.movil #tarjeta{left:auto;right:10px;width:min(46vw,340px);top:calc(60px + env(safe-area-inset-top))}
  body.movil #pista,body.movil #pista.dis{bottom:calc(76px + env(safe-area-inset-bottom));max-width:50vw}
}

.tienda .promesa{background:#ffd23f14;border:1px solid #ffd23f33;border-radius:10px;padding:8px 12px;color:var(--su);font-size:.9em;margin-bottom:10px}
.tienda .promesa b{color:var(--tx)}
.tienda .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tienda .chips button{padding:.45em .9em}
.tienda .pz{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:6px 0}
.tienda .pz>div{background:#0005;border:1px solid var(--borde);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.tienda .pz>div.on{border-color:var(--ok)}
.tienda .pz>div.sonando{border-color:var(--ac);background:#ffd23f1c;box-shadow:0 0 0 2px #ffd23f55;animation:sonando 1.1s ease-in-out infinite}
@keyframes sonando{0%,100%{box-shadow:0 0 0 2px #ffd23f55}50%{box-shadow:0 0 0 6px #ffd23f22}}
.tienda .pz small{color:var(--su);flex:1}
.tienda .pz .fila{margin:4px 0 0;padding:0;border:0;background:none;gap:6px}
.tienda .pz .fila .nota{margin:0;color:var(--ok)}
.tienda .aparte.gracias{border:1px solid #ff7ac866;background:#ff7ac812;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tienda .aparte.gracias .chips button.on{border-color:#ff7ac8;color:#ff7ac8}
.tienda .escalera{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tienda .escalera button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:.4em .7em;background:transparent;color:var(--su);border:1px solid var(--borde);font-weight:600;line-height:1.15;min-width:64px}
.tienda .escalera button b{color:var(--tx);font-size:1.05em}.tienda .escalera button small{font-size:.74em}
.tienda .escalera button.on{background:var(--ac);color:#1b120e}.tienda .escalera button.on b,.tienda .escalera button.on small{color:#1b120e}
.tienda .escalera button.mio{border-color:var(--ok)}.tienda .escalera button.mio b::after{content:" ✓";color:var(--ok)}.tienda .escalera button.on.mio b::after{color:#1b120e}
.tienda .carpeta{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
@media (max-width:640px){.tienda .carpeta{grid-template-columns:1fr}}
.tienda .vista{background:linear-gradient(#2b4f7a,#6f9bd0 42%,#f0a868 66%,#a9744f 67%,#5c3f2b);border:1px solid var(--borde);border-radius:12px;padding:8px;text-align:center}
.tienda .vista canvas{position:static;width:100%;height:auto;display:block;border-radius:8px}
.tienda .vista #esc3d canvas{position:static;width:100%;height:auto;display:block;border-radius:8px}
.tienda .chips.esc{justify-content:center;align-items:center;margin:8px 0 2px}.tienda .chips.esc button.on{border-color:var(--ac);background:#ffd23f22;color:var(--ac)}.tienda .chips.esc .nota{margin:0;width:100%;font-size:.8em}
.tienda .vista small{display:block;color:#fff;text-shadow:0 1px 2px #000;margin-top:4px;font-weight:700}
.tienda h4{margin:6px 0 4px}
.tienda .muestras{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tienda .sw{width:34px;height:34px;border-radius:50%;border:2px solid #0008;padding:0;box-shadow:0 1px 3px #0006}
.tienda .sw.on{outline:3px solid #fff;outline-offset:2px}
.tienda .calcas button{background:#0006;border:1px solid var(--borde);border-radius:8px;width:40px;height:40px;padding:0;font-size:1.3em;line-height:1}
.tienda .calcas button.on{background:var(--ac)}
.tienda .ops{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tienda .ops button{background:#0006;color:var(--tx);border:1px solid var(--borde);padding:.45em .8em}
.tienda .ops button.on{background:var(--ac);color:#1b120e;border-color:var(--ac)}
.tienda .pago{margin-top:14px;padding:12px;border:1px solid var(--borde);border-radius:12px;background:#0004}
.tienda .pago .grande{margin:0 0 4px}
.tienda .pago label.op{border:0;padding:4px 0}
.tienda .aparte{margin-top:18px;padding-top:12px;border-top:1px solid #ffffff1c}
.tienda input[type=number]{width:7em}
.tienda .nota a{color:#9fd4ff}
</style>
